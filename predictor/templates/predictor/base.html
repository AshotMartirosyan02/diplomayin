<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Անշարժ Գույքի Գնահատում</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">
    <!-- Google Fonts: Inter + Noto Sans Armenian -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Armenian:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --accent: #06b6d4;
            --bg-light: #f8fafc;
            --card-shadow: 0 10px 40px rgba(0,0,0,.08);
        }
        * { font-family: 'Noto Sans Armenian', 'Inter', system-ui, sans-serif; }
        body {
            background: var(--bg-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark)) !important;
            box-shadow: 0 4px 20px rgba(79, 70, 229, .25);
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.35rem;
            letter-spacing: .3px;
        }
        .navbar-brand i { color: var(--accent); }
        .hero-section {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #06b6d4 100%);
            padding: 3rem 0 2rem;
            color: #fff;
            text-align: center;
            margin-bottom: -2rem;
        }
        .hero-section h2 {
            font-weight: 700;
            font-size: 2rem;
            margin-bottom: .5rem;
        }
        .hero-section p {
            opacity: .85;
            font-size: 1.05rem;
            max-width: 600px;
            margin: 0 auto;
        }
        .content-wrapper {
            flex: 1;
            padding: 3rem 0 2rem;
        }
        .card-custom {
            border: none;
            border-radius: 1rem;
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }
        .card-custom .card-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            padding: 1.25rem 1.5rem;
            border: none;
        }
        .card-custom .card-header h4 {
            margin: 0;
            font-weight: 600;
        }
        .card-custom .card-body {
            padding: 2rem;
        }
        .form-label {
            font-weight: 500;
            color: #374151;
            margin-bottom: .4rem;
        }
        .form-control, .form-select {
            border-radius: .5rem;
            border: 1.5px solid #e5e7eb;
            padding: .65rem .9rem;
            transition: border-color .2s, box-shadow .2s;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, .15);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none;
            border-radius: .5rem;
            padding: .75rem 2rem;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform .15s, box-shadow .15s;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, .35);
            background: linear-gradient(135deg, var(--primary-dark), #3730a3);
        }
        .btn-outline-primary {
            border: 2px solid var(--primary);
            color: var(--primary);
            border-radius: .5rem;
            padding: .65rem 1.75rem;
            font-weight: 600;
            transition: all .2s;
        }
        .btn-outline-primary:hover {
            background: var(--primary);
            color: #fff;
            transform: translateY(-1px);
        }
        .price-display {
            font-size: 2.75rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.2;
        }
        .price-currency {
            font-size: 1.3rem;
            font-weight: 500;
            color: #6b7280;
        }
        .result-param {
            display: flex;
            justify-content: space-between;
            padding: .6rem 0;
            border-bottom: 1px solid #f3f4f6;
        }
        .result-param:last-child { border-bottom: none; }
        .result-param .param-label {
            color: #6b7280;
            font-weight: 500;
        }
        .result-param .param-value {
            font-weight: 600;
            color: #1f2937;
        }
        .success-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981, #059669);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }
        .success-icon i { font-size: 2rem; color: #fff; }
        footer {
            background: #1e1b4b;
            color: rgba(255,255,255,.6);
            text-align: center;
            padding: 1.25rem 0;
            font-size: .9rem;
        }
        .input-group-text {
            background: #f9fafb;
            border: 1.5px solid #e5e7eb;
            border-right: none;
            color: var(--primary);
        }
        .input-group .form-control {
            border-left: none;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-building me-2"></i>Անշարժ Գույքի Գնահատում
            </a>
        </div>
    </nav>

    {% block hero %}{% endblock %}

    <!-- Main Content -->
    <div class="content-wrapper">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            © 2026 Անշարժ Գույքի Գնահատման Համակարգ
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
