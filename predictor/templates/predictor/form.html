{% extends "predictor/base.html" %}

{% block hero %}
<section class="hero-section">
    <div class="container">
        <h2><i class="bi bi-houses me-2"></i>Անշարժ Գույքի Գնահատում</h2>
        <p>Օգտագործելով արհեստական ինտելեկտ և մեքենայական ուսուցում</p>
    </div>
</section>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7 col-md-9">
        <div class="card card-custom">
            <div class="card-header d-flex align-items-center">
                <i class="bi bi-calculator me-2 fs-5"></i>
                <h4>Լրացրեք պարամետրերը</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}

                    <!-- Area -->
                    <div class="mb-3">
                        <label for="area_sqm" class="form-label">
                            <i class="bi bi-aspect-ratio me-1"></i>Մակերեսություն (m²)
                        </label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-rulers"></i></span>
                            <input type="number" step="0.1" min="20" max="500"
                                   class="form-control" id="area_sqm" name="area_sqm"
                                   placeholder="օր.՝ 85.5" required>
                        </div>
                    </div>

                    <div class="row">
                        <!-- Rooms -->
                        <div class="col-md-6 mb-3">
                            <label for="rooms" class="form-label">
                                <i class="bi bi-door-open me-1"></i>Սենյակների քանակ
                            </label>
                            <input type="number" min="1" max="10"
                                   class="form-control" id="rooms" name="rooms"
                                   placeholder="օր.՝ 3" required>
                        </div>
                        <!-- Floor -->
                        <div class="col-md-6 mb-3">
                            <label for="floor" class="form-label">
                                <i class="bi bi-building me-1"></i>Հարկ
                            </label>
                            <input type="number" min="1" max="30"
                                   class="form-control" id="floor" name="floor"
                                   placeholder="օր.՝ 5" required>
                        </div>
                    </div>

                    <div class="row">
                        <!-- District -->
                        <div class="col-md-6 mb-3">
                            <label for="district" class="form-label">
                                <i class="bi bi-geo-alt me-1"></i>Շրջան
                            </label>
                            <select class="form-select" id="district" name="district" required>
                                <option value="" disabled selected>Ընտրեք շրջանը</option>
                                <option value="Kentron">Կենտրոն</option>
                                <option value="Arabkir">Արաբկիր</option>
                                <option value="Avan">Ավան</option>
                                <option value="Shengavit">Շենգավիտ</option>
                                <option value="Erebuni">Էրեբունի</option>
                            </select>
                        </div>
                        <!-- Condition -->
                        <div class="col-md-6 mb-3">
                            <label for="condition" class="form-label">
                                <i class="bi bi-house-check me-1"></i>Վիճակ
                            </label>
                            <select class="form-select" id="condition" name="condition" required>
                                <option value="" disabled selected>Ընտրեք վիճակը</option>
                                <option value="New">Նոր վերանորոգված</option>
                                <option value="Normal">Լավ վիճակ</option>
                                <option value="Old">Վերանորոգման կարիք ունի</option>
                            </select>
                        </div>
                    </div>

                    <!-- Submit -->
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-search me-2"></i>Գնահատել Արժեքը
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
